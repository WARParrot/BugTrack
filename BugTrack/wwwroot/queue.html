<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Очередь · BugTrack</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <a class="icon-btn" href="/projects.html" aria-label="К проектам">&#8592;</a>
            <a class="brand" href="/projects.html">BugTrack</a>
            <span class="proj-pill" hidden></span>
            <nav class="proj-nav">
                <a data-project-tab="/project.html">Обзор</a>
                <a data-project-tab="/queue.html" class="active">Очередь</a>
                <a data-project-tab="/participants.html">Участники</a>
                <a data-project-tab="/archive.html">Архив</a>
            </nav>
        </div>
        <div class="topbar-right">
            <span class="muted">Уведомления</span>
            <span class="role-chip badge" hidden></span>
            <button type="button" class="avatar" aria-label="Профиль"
                    onclick="location.assign('/profile.html')"></button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Разделы</h2>
            <a class="side-link" href="/projects.html">Все проекты</a>
        </aside>
        <main class="content">
            <div class="page-head">
                <h1 id="title">Очередь</h1>
            </div>
            <div class="alert" role="alert" hidden id="alert"></div>
            <div class="card">
                <p class="muted" id="status">Загрузка…</p>
                <table hidden>
                    <thead>
                        <tr>
                            <th>Тикет</th>
                            <th>Название</th>
                            <th>Статус</th>
                            <th>Приоритет</th>
                            <th>Исполнитель</th>
                            <th>Дедлайн</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { api, ApiError, initProjectPage, showError } from "/app.js";

        const ctx = await initProjectPage();
        if (ctx) {
            const params = new URLSearchParams(location.search);
            const alertEl = document.getElementById("alert");
            const statusEl = document.getElementById("status");
            const table = document.querySelector("table");
            const tbody = table.querySelector("tbody");

            try {
                const { tickets } = await api(`/projects/${ctx.project.id}/tickets`);

                const status = params.get("status");
                let list = status
                    ? tickets.filter((t) => t.status === status)
                    : tickets.filter((t) => t.status !== "CLOSED" && t.status !== "ARCHIVED");
                if (params.get("assigned")) list = list.filter((t) => t.assignee?.id === ctx.me.id);
                if (params.get("fixed")) list = list.filter((t) => t.mergeRequestUrl);

                document.getElementById("title").textContent =
                    `Очередь · ${ctx.project.name}${status ? ` · ${status}` : ""}`;

                if (list.length === 0) {
                    statusEl.textContent = "Тикетов нет.";
                } else {
                    const rows = list.map((t) => {
                        const tr = document.createElement("tr");
                        for (const text of [
                            t.id.split("-")[0].toUpperCase(),
                            t.title,
                            t.status,
                            t.priority,
                            t.assignee?.fullName ?? "Не назначен",
                            t.deadline ? new Date(t.deadline).toLocaleDateString("ru-RU") : "—",
                        ]) {
                            const td = document.createElement("td");
                            td.textContent = text;
                            tr.append(td);
                        }
                        return tr;
                    });
                    tbody.replaceChildren(...rows);
                    table.hidden = false;
                    statusEl.hidden = true;
                }
            } catch (e) {
                statusEl.hidden = true;
                showError(alertEl, e instanceof ApiError ? e.message : "Не удалось загрузить тикеты");
            }
        }
    </script>
</body>
</html>
